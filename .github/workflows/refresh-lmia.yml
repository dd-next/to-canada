name: Refresh LMIA history

on:
  schedule:
    - cron: '47 8 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: northward-data-publication
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
      source_failure: ${{ steps.refresh.outputs.source_failure }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check official source and retain last valid data on failure
        id: refresh
        env:
          NORTHWARD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          python3 -I pipeline/lmia/run.py
          code=$?
          set -e
          if [ "$code" = 2 ]; then
            echo 'source_failure=true' >> "$GITHUB_OUTPUT"
            echo 'Source check incomplete. Available valid records and failure details are retained.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi
      - name: Validate feed and ingestion regressions
        run: |
          python3 -I pipeline/lmia/check.py
          python3 -I -m unittest discover -s pipeline/lmia -p 'test_*.py'
      - name: Commit only this feed, reconcile main, and validate the exact publication
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/data/lmia
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh LMIA history $(date -u +%F)"
            git fetch origin main
            git rebase origin/main
            python3 -I pipeline/check_app_data.py
            npm run check:model
            npm run check:directories
            npm run build
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}

  report-source-failure:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.source_failure == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Source check incomplete. Last valid records retained. See feed coverage and refresh logs.'
          exit 1
