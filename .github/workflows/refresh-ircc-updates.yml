name: Refresh IRCC updates

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with the weekly statistics job: serialize data commits and publication.
concurrency:
  group: northward-data-publication
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
      source_failure: ${{ steps.refresh.outputs.source_failure }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31'
      - name: Refresh only official IRCC feeds
        id: refresh
        run: |
          set +e
          python3 -I pipeline/updates/run.py
          code=$?
          set -e
          if [ "$code" = 2 ]; then
            echo 'source_failure=true' >> "$GITHUB_OUTPUT"
            echo 'One or more sources failed; their last valid entries are retained.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi
      - name: Validate snapshot and ingestion regressions
        run: |
          python3 -I pipeline/updates/check.py
          python3 -I pipeline/updates/test_updates.py
      - name: Commit refreshed feed and source status
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/updates.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh official IRCC updates $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}

  report-source-failure:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.source_failure == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'IRCC check incomplete. Last valid records were retained and source status was published. Inspect the refresh log.'
          exit 1
