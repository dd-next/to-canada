# Weekly check of the official sources. If anything is newer (or on a manual run) the pipelines are re-run,
# the snapshot in public/data is rebuilt and validated, the result is committed to main, and the site is redeployed.
name: Refresh data

on:
  schedule:
    - cron: '23 10 * * 1' # Mondays 10:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Check official sources for newer data
        id: fresh
        run: |
          set +e
          python3 -I pipeline/freshness.py --strict
          code=$?
          if [ "$code" = "0" ]; then echo "newer=false" >> "$GITHUB_OUTPUT"; else echo "newer=true" >> "$GITHUB_OUTPUT"; fi
          # exit 1 means "something is newer"; anything else is a real failure
          [ "$code" = "0" ] || [ "$code" = "1" ]

      # A domain that fails to download keeps its previously committed outputs (same rule as pipeline/refresh.py).
      - name: Refresh housing
        if: steps.fresh.outputs.newer == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env: { NORTHWARD_REFRESH: '1' }
        run: python3 -I pipeline/housing/run.py
      - name: Refresh work
        if: steps.fresh.outputs.newer == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env: { NORTHWARD_REFRESH: '1' }
        run: python3 -I pipeline/work/run.py
      - name: Refresh immigration
        if: steps.fresh.outputs.newer == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env: { NORTHWARD_REFRESH: '1' }
        run: python3 -I pipeline/immigration/run.py
      - name: Refresh geo population estimates
        if: steps.fresh.outputs.newer == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env: { NORTHWARD_REFRESH: '1' }
        run: python3 -I pipeline/geo/run.py --pop-only

      - name: Rebuild and validate the snapshot
        if: steps.fresh.outputs.newer == 'true' || github.event_name == 'workflow_dispatch'
        env:
          NORTHWARD_REFRESH: '1'
        run: |
          python3 -I pipeline/freshness.py   # re-record freshness after the refresh
          python3 -I pipeline/build_app_data.py
          python3 -I pipeline/check_app_data.py
          npm run build

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/processed public/data
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Data refresh $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
