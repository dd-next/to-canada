# Refresh a staged statistical generation weekly. Failures publish diagnostics while keeping last valid data.
name: Refresh data

on:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with the lightweight IRCC workflow: serialize data commits and Pages publication.
concurrency:
  group: northward-data-publication
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh and validate a staged snapshot
        id: refresh
        env:
          NORTHWARD_REFRESH: '1'
        run: |
          set +e
          python3 -I pipeline/refresh.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Continue to publish diagnostics; a final step marks this run failed.
          exit 0
      - name: Validate the retained or updated application snapshot
        run: |
          python3 -I pipeline/check_app_data.py
          npm run build
      - name: Commit data and check reports
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/processed public/data
          if ! git diff --cached --quiet; then
            git commit -m "Data refresh $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Report incomplete refresh
        if: steps.refresh.outputs.code != '0'
        run: |
          echo "Refresh or source checks failed. Last valid statistics and diagnostic reports were retained."
          exit 1

  deploy:
    needs: refresh
    # A failed refresh can still publish its error report with the unchanged valid snapshot.
    if: always() && needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
